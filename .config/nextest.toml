# cargo-nextest config for brehon-fork.
#
# Nextest's process-per-test model isolates LazyLock<Settings> across
# tests, so the historical `--test-threads=1` constraint disappears.
# Each test gets its own process — `LazyLock` re-initializes per
# process and `LEMMY_DATABASE_URL` can differ per test.
#
# threads-required caps Docker Desktop concurrency. Each
# `pgautoupgrade:18-alpine` container uses ~150-300 MB. The laptop has
# 64 GB RAM so memory is not the constraint — the limit is Docker
# Desktop's named-pipe concurrency on Windows.
#
# Current setting: threads-required = 4 → 2 concurrent containers on
# an 8-core machine (test-threads=num-cpus=8, 8÷4=2). This is
# conservative. Raise to 2 (threads-required=4 unchanged, but increase
# test-threads via CLI) or lower threads-required to 2 (→ 4 concurrent)
# if Docker is comfortable. Measured wall-clock with threads-required=4:
# ~12 min for 41 tests at ~22s per test. RAM is NOT the bottleneck.
#
# If socket exhaustion or container-start failures appear: lower to
# threads-required = 8 (→ 1 concurrent on 8-core). If Docker handles
# more: lower to threads-required = 2 (→ 4 concurrent).
#
# Measurement recipe (run once to calibrate):
#   BREHON_NO_NEXTEST=0 scripts\brehon\cargo-nextest.bat run \
#     --workspace --features full --test e2e --profile default \
#     -E "test(~submit_jury_vote)" 2>&1 | tee /tmp/nextest-t4-jury.log
# Then change threads-required to 2 and re-run. Compare wall-clocks.
# If no socket errors at threads-required=2, make it permanent.
#
# Background:
#   - Perplexity research 2026-05-02 (saved at
#     C:\Users\barri\Downloads\I maintain a Rust monorepo*.md)
#   - feedback_local_validation_cycle_2026_05_02.md (this commit)
#   - feedback_e2e_nextest_filter_groups.md — scoped -E filter groups

[profile.default]
# 60s slow-test threshold; terminate after 3× (180s). Container
# startup + ~40 Diesel migrations currently runs ~90s per test cold;
# the pre-baked image (Phase 3 of plan) drops this to ~5-15s.
slow-timeout = { period = "60s", terminate-after = 3 }
test-threads = "num-cpus"

# Only e2e tests need a Postgres container — gate concurrency on the
# e2e binary specifically (copilot-4: previous filter `test(/.*/)`
# threw the same throttle on every unit test, slowing the whole
# workspace pointlessly).
[[profile.default.overrides]]
filter = 'binary(=e2e)'
threads-required = 4

[profile.ci]
# Used by `cargo nextest run --profile ci`. Reserved for any future
# milestone-PR e2e dispatch on GitHub Actions; longer slow-timeout
# accounts for ubuntu-latest cold-start.
slow-timeout = { period = "120s", terminate-after = 5 }
test-threads = "num-cpus"

# cr-7: explicit CI-profile override mirrors the threads-required gate
# rather than relying on profile.default.overrides fallback. Same
# binary scope as the default profile — only e2e is throttled.
[[profile.ci.overrides]]
filter = 'binary(=e2e)'
threads-required = 4
