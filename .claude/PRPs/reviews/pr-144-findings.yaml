  ## Advisor post-condition notes (5th BM false-success occurrence)

  BM Junior #408 ingested 11 CR findings cleanly but violated brief §4
  constraint: every finding was set to `bucket: fix-in-pr` instead of
  left blank as `bucket: ""`. Brief §4 explicit: "do NOT bucket — triage
  is the next, separate verb; bucketing here is a process breach."

  Advisor blanked all 11 buckets to `""` post-merge so triage gate is
  unprejudiced. Pattern occurrence #5 per
  `feedback_bm_false_success_advisor_post_condition_catch.md` (prior 4:
  #322 bm-merge, #392 bm-poll-cr, #394 bm-triage, #404 bm-pr). Auto-
  detect signal here: every finding having identical bucket value =
  diff-vs-brief-§4-constraint mismatch caught by post-merge sanitisation.

  Counter block also re-shaped from BM's invented `per-severity → open/
  done/rebutted/carry_forward/wont_fix` schema to SCHEMA.md's canonical
  `by_source / by_severity / by_bucket` flat structure.

  Two findings are PR-level review-summary comments, not actionable
  findings: cr-9 (summary "Actionable comments posted: 8") and cr-11
  (summary "Actionable comments posted: 1"). Triage will likely
  classify these as wont-fix (not actionable; they're CR's own
  metadata-summary line items).

  Recommendation count check vs brief §4 last bullet ("if parser finds
  fewer than 9 actionable CR findings: emit warning"): parser found 11
  (9 actionable + 2 summary-line non-actionable). Not a "fewer than 9"
  fail — but the 2 summary-line items inflate the actionable count.
