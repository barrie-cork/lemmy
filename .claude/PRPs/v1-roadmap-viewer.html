<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brehon v1 Roadmap</title>
<style>
  :root {
    --done:      #16a34a;
    --partial:   #d97706;
    --unstarted: #6b7280;
    --skipped:   #7c3aed;
    --in-flight: #2563eb;
    --done-bg:       #f0fdf4;
    --partial-bg:    #fffbeb;
    --unstarted-bg:  #f9fafb;
    --skipped-bg:    #f5f3ff;
    --in-flight-bg:  #eff6ff;
    --card-border: 1px solid #e5e7eb;
    --radius: 8px;
    --font: system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: #f1f5f9;
    color: #1e293b;
    min-height: 100vh;
    padding: 24px;
  }

  header {
    max-width: 1400px;
    margin: 0 auto 24px;
  }

  header h1 { font-size: 1.6rem; font-weight: 700; }
  header p  { font-size: 0.85rem; color: #64748b; margin-top: 4px; }

  /* Legend */
  .legend {
    display: flex; flex-wrap: wrap; gap: 12px;
    margin-top: 12px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em;
  }
  .badge.done      { background: #dcfce7; color: var(--done); }
  .badge.partial   { background: #fef3c7; color: var(--partial); }
  .badge.unstarted { background: #f3f4f6; color: var(--unstarted); }
  .badge.skipped   { background: #ede9fe; color: var(--skipped); }
  .badge.in_flight { background: #dbeafe; color: var(--in-flight); }

  /* Kanban board */
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto 32px;
  }

  /* Lane card */
  .lane {
    background: #fff;
    border: var(--card-border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .lane-header {
    padding: 14px 16px 10px;
    border-bottom: var(--card-border);
  }

  .lane-title {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 8px;
  }

  .lane-name { font-size: 1rem; font-weight: 700; }
  .lane-key  { font-size: 0.75rem; color: #64748b; font-weight: 500; }
  .lane-summary {
    font-size: 0.78rem; color: #64748b; margin-top: 6px; line-height: 1.4;
  }

  /* Sub-phase list */
  .sub-phases { padding: 8px 12px; flex: 1; }

  .sp-card {
    border: var(--card-border);
    border-radius: 6px;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .sp-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    user-select: none;
  }

  .sp-header:hover { background: #f8fafc; }

  .sp-id   { font-size: 0.75rem; font-weight: 700; font-family: monospace; }
  .sp-scope { font-size: 0.75rem; color: #475569; flex: 1; line-height: 1.3; }

  .sp-detail {
    font-size: 0.75rem; color: #64748b;
    padding: 0 10px 8px;
    border-top: 1px solid #f1f5f9;
    line-height: 1.5;
    display: none;
  }

  .sp-detail.open { display: block; }

  .sp-detail a { color: #2563eb; text-decoration: none; }
  .sp-detail a:hover { text-decoration: underline; }

  .sp-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .sp-meta-tag {
    background: #f1f5f9; border-radius: 4px;
    padding: 1px 6px; font-size: 0.7rem; color: #475569;
  }

  /* Status-coloured left border on sp-card */
  .sp-card.done      { border-left: 3px solid var(--done); }
  .sp-card.partial   { border-left: 3px solid var(--partial); }
  .sp-card.unstarted { border-left: 3px solid var(--unstarted); }
  .sp-card.skipped   { border-left: 3px solid var(--skipped); }
  .sp-card.in_flight { border-left: 3px solid var(--in-flight); }

  /* Followups */
  .followups {
    padding: 8px 12px 10px;
    border-top: var(--card-border);
  }

  .followups-title {
    font-size: 0.7rem; font-weight: 700; color: #64748b;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;
  }

  .followups ul { padding-left: 14px; }
  .followups li { font-size: 0.72rem; color: #64748b; line-height: 1.4; margin-bottom: 2px; }

  /* Section title */
  .section-title {
    max-width: 1400px; margin: 0 auto 12px;
    font-size: 1rem; font-weight: 700; color: #475569;
    border-left: 3px solid #cbd5e1; padding-left: 10px;
  }

  /* What remains panel */
  .remains {
    max-width: 1400px;
    margin: 0 auto 32px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  .remains-card {
    background: #fff;
    border: var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .remains-card h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 8px; }
  .remains-card ul { padding-left: 16px; }
  .remains-card li { font-size: 0.8rem; color: #475569; margin-bottom: 4px; line-height: 1.4; }

  .remains-card.high-priority { border-left: 3px solid #ef4444; }
  .remains-card.steering      { border-left: 3px solid #2563eb; }
  .remains-card.inflight      { border-left: 3px solid var(--in-flight); }
  .remains-card.docs          { border-left: 3px solid #d97706; }

  .steering-block {
    font-size: 0.8rem; color: #475569; line-height: 1.5;
  }

  .steering-block strong { color: #1e293b; }

  footer {
    text-align: center; font-size: 0.72rem; color: #94a3b8;
    padding-bottom: 16px;
  }
</style>
</head>

// HELPERS

function badge(status) {
  const label = status === 'in_flight' ? 'in-flight' : status;
  return `<span class="badge ${status}">${label}</span>`;
}

function prLinks(pr) {
  if (!pr) return '—';
  const nums = Array.isArray(pr) ? pr : [pr];
  return nums.map(n => `<a href="https://github.com/barrie-cork/lemmy/pull/${n}" target="_blank">#${n}</a>`).join(', ');
}

function togDetail(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

// ──────────────────────────────────────────────────────────
// RENDER MAIN LANES
// ──────────────────────────────────────────────────────────
function renderLane(key, lane) {
  const sps = Object.entries(lane.sub_phases || {});
  const spCards = sps.map(([id, sp], i) => {
    const detailId = `sp-${key}-${i}`;
    const metaTags = [];
    if (sp.pr)            metaTags.push(`PR ${prLinks(sp.pr)}`);
    else if (sp.direct_to_trunk) metaTags.push('direct-to-trunk');
    if (sp.merge_commit)  metaTags.push(`<code>${sp.merge_commit.slice(0,7)}</code>`);
    if (sp.plan)          metaTags.push(`<a href="${sp.plan}" title="${sp.plan}">plan</a>`);
    if (sp.retro)         metaTags.push(`<a href="${sp.retro}" title="${sp.retro}">retro</a>`);
    if (sp.verify)        metaTags.push(`<a href="${sp.verify}" title="${sp.verify}">verify</a>`);
    if (sp.blocker)       metaTags.push(`<em>blocker: ${sp.blocker}</em>`);

    return `
      <div class="sp-card ${sp.status}">
        <div class="sp-header" onclick="togDetail('${detailId}')">
          ${badge(sp.status)}
          <span class="sp-id">${id}</span>
          <span class="sp-scope">${sp.scope}</span>
        </div>
        <div class="sp-detail" id="${detailId}">
          ${sp.note ? `<p style="margin-bottom:4px;font-style:italic">${sp.note}</p>` : ''}
          <div class="sp-meta">${metaTags.map(t => `<span class="sp-meta-tag">${t}</span>`).join('')}</div>
        </div>
      </div>`;
  }).join('');

  const followups = (lane.known_followups || []).length > 0 ? `
    <div class="followups">
      <div class="followups-title">Known follow-ups</div>
      <ul>${(lane.known_followups).map(f => `<li>${f}</li>`).join('')}</ul>
    </div>` : '';

  return `
    <div class="lane">
      <div class="lane-header">
        <div class="lane-title">
          <span>
            <span class="lane-key">${key}</span>
            &nbsp;
            <span class="lane-name">${lane.name}</span>
          </span>
          ${badge(lane.status)}
        </div>
        <div class="lane-summary">${lane.evidence_summary || ''}</div>
      </div>
      <div class="sub-phases">${spCards}</div>
      ${followups}
    </div>`;
}

document.getElementById('main-board').innerHTML =
  Object.entries(ROADMAP.lanes).map(([k,v]) => renderLane(k, v)).join('');

// ──────────────────────────────────────────────────────────
// RENDER META LANES
// ──────────────────────────────────────────────────────────
function renderMetaLane(key, ml) {
  const metaTags = [];
  if (ml.pr)           metaTags.push(`PR ${prLinks(ml.pr)}`);
  if (ml.merge_commit) metaTags.push(`<code>${ml.merge_commit.slice(0,7)}</code>`);
  if (ml.plan)         metaTags.push(`<a href="${ml.plan}">plan</a>`);
  if (ml.retro)        metaTags.push(`<a href="${ml.retro}">retro</a>`);
  if (ml.verify)       metaTags.push(`<a href="${ml.verify}">verify</a>`);

  return `
    <div class="lane" style="min-height:0">
      <div class="lane-header">
        <div class="lane-title">
          <span class="lane-name">${ml.name || key}</span>
          ${badge(ml.status)}
        </div>
        <div class="lane-summary">${ml.purpose || ''}</div>
      </div>
      <div class="sub-phases">
        <div class="sp-meta" style="padding:4px 2px">
          ${metaTags.map(t => `<span class="sp-meta-tag">${t}</span>`).join('')}
        </div>
        ${ml.note ? `<p style="font-size:0.72rem;color:#64748b;margin-top:4px;font-style:italic">${ml.note}</p>` : ''}
      </div>
    </div>`;
}

document.getElementById('meta-board').innerHTML =
  Object.entries(ROADMAP.meta_lanes).map(([k,v]) => renderMetaLane(k,v)).join('');

// ──────────────────────────────────────────────────────────
// RENDER WHAT REMAINS
// ──────────────────────────────────────────────────────────
const wr = ROADMAP.what_remains;

const hiPri = wr.high_priority_unstarted.map(hp => `
  <li>
    <strong>${hp.lane}</strong>: ${hp.items.join(', ')}<br>
    <span style="color:#6b7280;font-size:0.75rem">${hp.rationale}</span>
  </li>`).join('');

const inFlight = wr.in_flight_outside_roadmap.map(inf => `
  <li>
    <strong>${inf.lane}</strong> &mdash; worktree <code>${inf.worktree}</code>, branch <code>${inf.branch}</code><br>
    <span style="color:#6b7280;font-size:0.75rem">${inf.note}</span>
  </li>`).join('');

const steering = wr.steering;

document.getElementById('remains-board').innerHTML = `
  <div class="remains-card high-priority">
    <h3>High-Priority Unstarted</h3>
    <ul>${hiPri}</ul>
  </div>
  <div class="remains-card inflight">
    <h3>In-Flight Outside Roadmap</h3>
    <ul>${inFlight}</ul>
  </div>
  <div class="remains-card steering">
    <h3>Implementation Steering</h3>
    <div class="steering-block">
      <p><strong>Next logical sub-phase:</strong> ${steering.next_logical_sub_phase}</p>
      <p style="margin-top:8px"><strong>Ship first because:</strong> ${steering.ship_first_rationale}</p>
      <p style="margin-top:8px"><strong>RT later because:</strong> ${steering.RT_later_rationale}</p>
    </div>
  </div>
  <div class="remains-card docs">
    <h3>Documentation Drift</h3>
    <ul>${wr.documentation_drift.map(d => `<li>${d}</li>`).join('')}</ul>
  </div>`;
</script>
</body>
</html>
