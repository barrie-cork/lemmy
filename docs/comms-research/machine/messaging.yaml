# Brehon Consensus — structured message bank
# Machine-readable companion to themes/. Source of truth for website/CMS reuse.
# Status: DRAFT for founder review (2026-06-27). Not approved copy.
# Honesty rule: anything tagged status:vision must be rendered as "designed to /
# will", never present tense. See themes/07-traps-and-tone.md.

meta:
  audience_primary: grassroots-organisers
  tone: plain, warm, confident, sober
  reviewed: false
  date: 2026-06-27

# The locked framing decisions (founder, 2026-06-27)
framing:
  two_jobs: "Membership & Mediation"
  pillars: [make, decide, repair]            # You make rules / decide together / repair not punish
  umbrella_noun: governance                  # abstract level only; never the greeting
  greeting_verb: "govern yourselves"         # lead with the verb, not a category noun
  master_spine: "Bottom-up, not top-down — at every layer"  # themes/14; THE spine (founder decision 2026-06-27)
  spine_why: "You don't need a tech company to run your community fairly. You never did."  # SP-1 reframe: it's a choice not a natural law; plain public line, not 'ideology'
  spine_how: "Bottom-up at every layer — rules/moderation/standing/power all flow UP from the membership"  # the mechanism that proves the WHY
  narrative_spine: "There are lots of alternatives"   # anti-TINA (themes/03) — the narrative/evidence half, feeds the spine
  brehon_role: "evidence alternatives exist, not heritage romance; bottom-up rule-making (norms->customs->good-practice->codified)"
  ideology_framing_tone: "OPEN founder call — plain/empowering line is public lead; 'manufactured common sense / ideological imposition' is deep-copy only. Revisit at about-page draft."
  category_by_depth:                          # which noun for which reader (themes/02)
    organiser: "a fair way for your group to govern itself"
    curious_press: "an open governance layer for online communities"
    technical: "a portable open-source governance layer / emerging standard"

# Core lines at each rung (themes/06)
ladder:
  rung0_7word:
    primary: "Fair self-government for any online community."
    warm: "Run your group fairly — together."
  rung1_sentence: >
    Brehon Consensus is an open, fair way for any group to govern itself —
    deciding together who belongs and how to put things right, in the open,
    with repair instead of punishment.
  rung2_paragraph_ref: themes/06-message-ladder.md#rung-2
  rung3_pamphlet_ref: themes/06-message-ladder.md#rung-3

# The three pillars, expanded (themes/01)
pillars:
  - id: make
    line: "You make your own rules — and the stakes."
    means: "The group writes its own rules AND agrees how much breaking them costs; everyone consents to the deal. Nobody outside decides. Self-organising."
    mechanic: [customisable-rule-sets, community-set-stakes, consent]
  - id: decide
    line: "You decide together, in the open."
    means: "Serious decisions by ordinary members, picked like a jury; every one logged with reasons."
    mechanic: [juries, consensus-thresholds, public-case-log]
  - id: repair
    line: "You repair, you don't just punish."
    means: "Responses start gentle and aim to fix harm and bring people back. Banishment is last resort."
    mechanic: [graduated-restorative-sanctions, reintegration, appeals]
    hook: "the opposite of cancel culture — accountability without annihilation"

# Sharp positioning hooks (themes/09, 10) — high-conversion, handle with care
hooks:
  anti_cancel_culture:                 # themes/09
    line: "Your members handle it, by your rules — repair, not exile. A fair hearing, and a way back."
    line_alts: ["A fair hearing, and a way back.", "Fall out without falling apart."]
    internal_label: "accountability without annihilation"   # STRATEGY TERM ONLY — never public copy
    contrast: "graduated note->reduced-reach->pause->exclusion(last); fair panel not a mob; guaranteed appeal; reintegration"
    caution: "NEVER use the phrase 'cancel culture' in lead copy (research C2: partisan/toxic) — describe the lived experience. Re-express in OUR mechanic (member jury + your rules + repair), not borrowed slogans. Pro-process, not a culture-war side."
  reputation_by_helping:               # themes/10
    line: "Likes don't buy you standing here. Helping does."
    means_today: "standing earned by JURY SERVICE (juror_aligned +10) AND by accurate REPORTING (reporter_upheld +10) — both live v0 mechanics, verified config.rs 2026-06-27"
    means_design: "ways of helping: judging fairly (live), reporting fairly (live), vouching/endorsement (live); 'showing up'/tenure-based gains = design"
    hard_line: "posting/liking/sharing are IRRELEVANT to standing — engagement is not reputation; severs attention->power link"
    not: [social-credit-score, influencer-clout, popularity-contest, single-number-leaderboard]
    caution: "always frame as 'earn by helping', never 'gain points'/'level up'; never show a number; today=jury participation"
    two_directional: "standing also DROPS when a post is reported and found to break the community's consent rules; sustained low standing shrinks your role (less likely called for jury; below a floor, not called / can't vote on some things)"
    community_sets_stakes: "how much a violation costs is set BY THE COMMUNITY when they write their rules and all consent to them — not by the software, not by us, not by a hidden algorithm"
    stakes_one_liner: "Break the rules your community agreed, and your standing reflects it — by exactly the amount your community decided, together, in advance."
    stakes_honesty: "verify which severity dials are community-settable in live v0 vs design before public specifics (repo 01-vision 5.2 + sanction ladder)"
  invitation_as_defence:               # themes/11
    line: "Bots can't get a reference. Provocateurs can't hide who let them in."
    mechanism: "inviter stakes own reputation on you -> entry costly + traceable; bad behaviour ripples up the vouching chain"
    defends_against: [bots-ai-spam, agents-provocateurs-paid-agitators, brigades-pile-ons, sock-puppets-sybils, drive-by-rule-breakers]
    why_now: "these are the defining daily pains of mainstream social media in 2026; people are exhausted and want out — the exhaustion IS the demand; meet it with relief not a lecture"
    inclusivity_valve: "time-based entry exists too; welcoming to people, hostile to floods; community sets its own openness"
    honesty: "claim 'much costlier + traceable', NOT 'impossible'"
  everybody_moderates:                 # themes/12
    line: "No one is the moderator, because everyone is — a little. The more of you, the less each does."
    mechanism: "cases shared across membership via RANDOM jury draw + a REST period after serving (fair by design)"
    scaling: "counter-intuitive: more members = LIGHTER per-person load (opposite of normal platforms)"
    answers: "the #1 organiser pain — referee burnout + single-point-of-failure clique"
    honesty: "'minimal IF enough people' — small pools mean more frequent turns; shared effort, not zero effort; verify draw+cooldown live v0"
  bottom_up:                           # themes/14 — candidate SPINE
    line: "Bottom-up, not top-down — at every layer."
    means: "rules grow from members' practice + consent (not handed down); moderation shared across all; reputation earned by helping; power flows UP from the membership"
    brehon_backbone: "Brehon law was bottom-up: norms -> customs -> good practice -> codified. Rules proved themselves in practice BEFORE being written."
    rule_making_loop: "felt need -> propose a rule -> members consent (by whatever method suits them) -> enforceable. NOT feeling -> report -> punish."
    experimentation: "no mandated consensus method; trying what works IS the point (Dawn of Everything)"

# The moderation flow, structured (themes/13). RULES decide cases, NOT feelings.
moderation_flow:
  correction: "judged by the RULES, not by whether one person finds it offensive; if no rule covers it, propose a rule (bottom-up), don't report a feeling"
  steps:
    - "member posts/comments on the host platform (e.g. a Lemmy server)"
    - "any member REPORTS it as breaking rule X (with reasons + evidence: quotes, context, links)"
    - "a jury is drawn to compare the content to the RULE cited, weighing evidence"
    - "jury decides by the community's thresholds"
    - "found-against-rule -> reported person's standing DOWN; reporter gains a little (+10 on an UPHELD report, -5 if dismissed — LIVE in v0; reward follows a correct rule-based report, never a vendetta)"
    - "sustained low standing -> smaller role (less likely called; below a floor not called / can't vote on some things)"
  honesty: "report->case threshold, jury draw, reporter-reward (+10/-5), min-standing gate all LIVE in v0 (verified config.rs 2026-06-27). Reputation DECAY is wired but default-off."

# Anchor analogies (themes/04). leak = what it gets wrong, must be named.
analogies:
  - id: email
    tier: 1
    carries: [open-standard, federation, no-central-owner, cross-protocol]
    leak: "email moves messages; this makes decisions — say so explicitly"
  - id: job-reference
    tier: 1
    carries: [sponsorship, shared-risk, sybil-resistance]
    leak: "can feel like gatekeeping — pair with time-based fallback"
  - id: jury-duty
    tier: 1
    carries: [peer-judgment, no-moderator-class, transparency]
    leak: "evokes courts/punishment — pair with restorative outcome"
  - id: rulebook-constitution
    tier: 2
    carries: [customisable-rules, self-organisation]
  - id: repair-cafe
    tier: 2
    carries: [restorative, reintegration, inclusivity]
  - id: new-coworker-trust
    tier: 2
    carries: [earned-slowly, capability-not-score]
    leak: "must distance from social-credit-score / credit-rating"
  - id: neighbours-warning
    tier: 2
    carries: [federation-advisory, local-sovereignty]

# Customisable knobs (themes/15). Verified vs live v0 code 2026-06-27 (config.rs + reputation_snapshot.rs).
customisation:
  line: "It's yours to tune — it bends to your community, not the other way round."
  knobs:
    - {knob: rules, controls: "what's allowed / what breaks them", status: live}
    - {knob: stakes, controls: "how much a violation costs standing (sanction deltas)", status: live}      # DEFAULT_DELTAS_* config rows, per-community override
    - {knob: reputation-decay-rate, controls: "how fast standing fades; dial DOWN to encourage engagement", status: design-default-off}  # feature.reputation_v1_decay_enabled defaults FALSE; wired but inactive in default v0
    - {knob: reporter-reward, controls: "standing gain for an UPHELD report (+10) / loss for dismissed (-5)", status: live}  # DEFAULT_DELTAS_REPORTER_UPHELD/DISMISSED
    - {knob: jury-thresholds, controls: "agreement needed (quorum 3 of panel 5)", status: live}            # DEFAULT_JURY_QUORUM / PANEL_SIZE
    - {knob: jury-cooldown-rest, controls: "max concurrent assignments + age requirement", status: live}   # DEFAULT_JURY_MAX_CONCURRENT_ASSIGNMENTS=3, AGE_REQUIREMENT_DAYS=60
    - {knob: min-standing-to-be-called-or-vote, controls: "floor below which role shrinks (thresholds)", status: live}  # DEFAULT_THRESHOLDS_*
    - {knob: entry-openness, controls: "vouching vs time-based balance (inclusivity valve)", status: verify}  # endorsement live; time-based balance not yet code-confirmed
  honesty: "most knobs are LIVE + per-community DB-overridable in v0. EXCEPTIONS to flag honestly: reputation-decay is wired but DEFAULT-OFF (say 'can be enabled', not 'standing fades'); entry-openness time-balance unconfirmed. Frame those two as 'designed to', not present tense."

# Lead-adopter / on-ramp (themes/05)
on_ramp:
  primary_early_adopter: "small, low-stakes, everyday community groups (e.g. Cork City Gardens) — existing real-world groups giving members a self-governed online home"
  framing: "low stakes = freedom to EXPERIMENT safely; welcoming + low-barrier, NOT militant; 'a calm, fair, drama-light place to run your group, that you control and can tinker with'"
  examples: [garden-club, allotment, residents-association, hobby-club, parents-group, choir]

# Words we use deliberately (themes/07, 08)
word_choices:
  moderation: "use to be FOUND and understood (the searchable pain-word)"
  mediation:  "use to REVEAL the difference — fair, peer, repair-focused"
  governance: "use as abstract umbrella only (press/category), never greeting"
  sequence:   "name the jobs -> moderation/mediation pivot -> governance umbrella"

# Things to NEVER do in public copy (themes/07)
forbidden:
  - blockchain-in-lead          # misleads as crypto; it's a maybe-someday V3 audit anchor
  - tokens-or-onchain-voting    # opposite of the project
  - social-credit-score-framing
  - celtic-mysticism-romance
  - lemmy-fork-as-headline      # that's how, not what
  - utopia-overclaim            # it governs membership+moderation only
  - future-as-present-tense     # cross-protocol is vision, not shipped

# Proof points (verified against research Section E, 2026-06-27)
proof_points:
  - claim: "humans have run fair non-hierarchical rule-based societies repeatedly"
    source: "Graeber & Wengrow, The Dawn of Everything (2021)"
    status: safe-general            # solid for the general argument; do NOT cite specific archaeological facts (critics: Morris, Feinman, Bell)
    caveat: "hedge specifics ('some scholars dispute the details'); use for the general anti-linear-history point only"
  - claim: "Brehon law ran for centuries with no state/police/prisons"
    source: "Fergus Kelly (1988); Robin Chapman Stacey (1994); Biggins (2024)"
    status: safe                    # SOLID per Section E; enforcement via suretyship (rath/naidm/aitire) + distraint (athgabal)
  - claim: "Brehon law was bottom-up: norms -> customs -> good practice -> codified"
    source: "Biggins (2024), History Ireland"
    status: safe                    # SOLID per Section E; verify exact Biggins phrasing before a direct quote
  - claim: "customary/tribal law has been invoked successfully in modern courts"
    source: "Mabo v Queensland [1992] HCA 23 (native title); Ellis v R [2022] NZSC (tikanga); Tsilhqot'in Nation v BC [2014] SCC 44 (Aboriginal title)"
    status: safe
    caveat: "NONE are Brehon-specific; ALL are First Nations/Indigenous, none Irish. Cite as 'customary law holds up in court', NEVER as 'Brehon law wins in court'. No Brehon-specific modern case exists."

status_honesty:
  stage: alpha
  team: solo-developer
  shipped: "v0 governance scope, Lemmy host only"
  vision_not_shipped: [matrix, peertube, meshcore, cross-protocol, full-federation]
  rule: "present tense for shipped only; 'designed to'/'will' for vision"
