# Brehon-fork governance-v0 CodeRabbit configuration.
# Docs: https://docs.coderabbit.ai/guides/configure-coderabbit
#
# Scope: AI review for PRs targeting governance-v0 only. `main` is reserved
# for weekly upstream rebases — reviewing those would waste the free-tier
# rate limit on upstream commits.
#
# Escape hatch for rebase-burst days: if CodeRabbit's ~4 PRs/hour limit kicks
# in during a burst of small PRs, flip `reviews.auto_review.enabled` to false
# in a one-line PR, merge the burst, then flip it back on.

language: en-GB
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - governance-v0
    ignore_title_keywords:
      - WIP
      - upstream-rebase
      - "chore(rebase)"

  # Do not review archived design history, vendored files, or upstream subtrees.
  path_filters:
    - "!docs/brehon-law-inspired-network/chat1.md"
    - "!docs/brehon-law-inspired-network/chat2.md"
    - "!docs/brehon-law-inspired-network/*.docx"
    - "!docs/brehon-law-inspired-network/*.pdf"
    - "!api_tests/pnpm-lock.yaml"
    - "!Cargo.lock"
    - "!**/translations/**"
    - "!target/**"
    - "!**/volumes/**"
    - "!**/dist/**"
    - "!scripts/brehon/*.bat"
    - "!.woodpecker.yml"

  # Global review focus. The Linux build (local Docker mirror of CI + the
  # cargo-validate workflows) is the authority on COMPILATION; clippy is the
  # authority on lints. CodeRabbit's value is the semantic layer those cannot
  # see. These directives encode three documented CR-failure lessons so the
  # reviewer spends its budget on real blindspots, not compile-adjacent noise.
  instructions: |
    You are a SEMANTIC reviewer, not a compiler. The Linux build already
    proves this code compiles and the clippy gate proves it is lint-clean —
    do NOT report type errors, trait-bound errors, missing-import, or syntax
    issues as defects, and never state with confidence that code "will not
    compile". If something looks type-wrong, frame it as a question, not a
    blocking finding.

    NEVER suggest a method substitution on a Diesel query-builder expression
    unless you can cite the specific trait that makes the replacement valid.
    Diesel's trait surface makes seemingly-equivalent swaps non-equivalent:
    `.get(0)` → `.first()` BROKE `LimitDsl` in a past PR (#132). Treat
    `.first()`, `.get(0)`, iterator-adapter swaps, and `.into()` changes on
    Diesel expressions as OFF-LIMITS unless trait-justified.

    Spend your review budget on what compilation and clippy CANNOT catch:
    - Swallowed/ignored errors: a `Result` mapped to `()`, `let _ =` on a
      fallible call, `.ok()` that discards an error that should surface, an
      `unwrap_or_default()` masking a real failure path.
    - Missing transaction boundaries: a handler doing 2+ DB writes that must
      be atomic but uses separate `context.pool()` calls instead of one
      `conn.run_transaction(|conn| async move { ... }.boxed())`. Reference:
      crates/api/api/src/community/ban.rs.
    - JSONB byte-determinism: any Rust-side recomputation of a hash/digest of
      a value Postgres produced. Postgres `jsonb::text` renders `{"n": 1}`
      (spaces); serde_json compact renders `{"n":1}` (no spaces). Re-hashing
      a Diesel-loaded value through serde_json will MISMATCH the trigger's
      hash. Flag any such round-trip; the correct pattern reads PG's own
      `payload::text` via raw `sql_query`.
    - Semantic ADR violations per the path-specific instructions below.

    Severity labels reflect SEMANTIC impact, not surface. A swallowed error in
    a governance write is critical even if it is one line; a style nit is a nit
    even if it spans many lines.

  # Tighter review on governance-owned code. Each block cites the ADR(s) it
  # is enforcing so the CodeRabbit summary traces back to the same source of
  # truth as `.github/ai-review-prompts/adr-rubric.md`.
  path_instructions:
    - path: "crates/db_schema/src/source/governance/**"
      instructions: |
        Phase 1 / ADR-008 territory. Enforce:
        - Append-only governance_log: any migration or model change that
          touches governance_log must preserve the BEFORE INSERT hash-chain
          trigger and the GRANT that denies UPDATE/DELETE to the app role.
        - CaseStatus MUST include EmergencyRemove (ADR-013). Flag any diff
          that removes it or introduces non-exhaustive matches elsewhere.
        - No direct PII in governance_log payloads (ADR-015): usernames,
          emails, display names. Only actor_pseudonym.
        - JSONB hash determinism: if any code recomputes a hash/digest of a
          governance_log payload, it MUST read Postgres's own `payload::text`
          rendering (raw sql_query), not re-serialise a Diesel-loaded value
          through serde_json — the byte sequences differ (PG `{"n": 1}` vs
          serde `{"n":1}`) and break the hash chain. Flag serde_json round-trips
          in any hash/signature context.

    - path: "crates/db_views/governance_case/**"
      instructions: |
        Phase 2a view-crate Selectable rule: bare-scalar fields (i32, String,
        stub placeholders) force tuple-load + map. Do NOT allow
        #[derive(Selectable)] on these views. Flag any PR that adds it.
        Reference pattern: crates/db_views/governance_case/src/impls.rs.

    - path: "crates/db_views/jury_queue/**"
      instructions: |
        Phase 2a view-crate Selectable rule applies. Additionally: per ADR-009,
        direct moderator action on a case under jury review must move the
        case to admin-review state, not continue the jury flow. Flag any
        view or query that assumes only one of the two paths.

    - path: "crates/db_views/governance_modlog/**"
      instructions: |
        Phase 2b. Modlog views must return redacted text only per ADR-015.
        Every user-visible string must be scrubbed via the redaction service
        before leaving the database. Flag any SELECT that pulls raw
        person.name, person.email, local_user.email, or display_name into a
        public log row.

    - path: "crates/db_views/reputation/**"
      instructions: |
        Phase 5. Reputation is four-dimensional and event-sourced per ADR-005.
        Flag views that collapse the four dimensions into a single score or
        expose raw reputation numbers to the public API (users see
        capabilities like `jury_eligible` and `trusted_reporter`, not
        numbers).

    - path: "crates/api/api_common/src/governance.rs"
      instructions: |
        DTO scope check. v0 shipped exactly 11 endpoints per ADR-010 and
        05-mvp-and-delivery-plan.md §2. v1 extends this under OQ-020 and
        the v1 PRDs — new endpoints that have a corresponding v1 PRD story
        are sanctioned. Flag DTOs that map to NO v0 or v1 PRD story.
        RevokeEndorsement DTO is allowed (Phase 3 task 35 exception).
        Flag business logic inside DTO impls — DTOs are shape-only.

    - path: "crates/api/api/src/governance/**"
      instructions: |
        Phase 4 handler code. Enforce:
        - Every match on CaseStatus is exhaustive and handles EmergencyRemove
          explicitly (ADR-013). No wildcard `_ =>` arms on CaseStatus.
        - Every governance write emits an append-only log entry BEFORE
          returning the response (ADR-008). Flag handlers that insert/update
          governance tables without a matching governance_log::append().
        - Every user-visible string in a response or log payload is passed
          through scrub()/redaction before leaving the handler (ADR-015).
        - No Keycloak, OpenFGA, Vault, HSM, KMS, or external signer imports
          (ADR-010 — v2 scope).
        - Integration tests hit a real Postgres. Flag any test that mocks
          the DB.
        - Atomicity: any handler with 2+ DB writes that must succeed-or-fail
          together MUST wrap them in a single `conn.run_transaction(|conn|
          async move { ... }.boxed())` — separate `context.pool()` calls per
          insert do NOT share a transaction. submit_jury_vote (5+ writes) is
          the canonical case. Auth/read-only checks go BEFORE the transaction.
          Flag multi-write handlers that lack a shared transaction.
        - Silent failures: flag any fallible governance call whose error is
          discarded (`let _ =`, `.ok()`, `unwrap_or_default()` on a real
          failure path). A governance write that can fail silently is a
          critical finding regardless of line count.

    - path: "crates/api/api_crud/src/governance/**"
      instructions: |
        Phase 4 create_report handler lives here. Same rules as
        crates/api/api/src/governance/** plus: the report threshold
        calculation is tunable config, not hard-coded. See OQ-006 in
        99-decisions-and-open-questions.md for the draft formula.

    - path: "migrations/**"
      instructions: |
        Flag any migration that ALTERs, DROPs, or TRUNCATEs governance_log,
        moderation_case, jury_assignment, jury_vote, sanction, appeal,
        public_case_log, or actor_pseudonym. ADR-008 and ADR-015 forbid
        destructive changes to these without a superseding ADR. Also flag
        any migration that removes the governance_log hash-chain trigger
        or the UPDATE/DELETE deny-grant.

    - path: "crates/apub/objects/src/governance/**"
      instructions: |
        Phase 6 AP object types. Per ADR-014, governance AP types only
        propagate between Brehon-forks; vanilla Lemmy peers silently
        discard them. Flag code that assumes a vanilla peer can interpret
        ModerationLabelObject, TrustAttestationObject, or SanctionNoticeObject.

    - path: "crates/apub/activities/src/governance/**"
      instructions: |
        Phase 6 activities. Same ADR-014 rule as apub/objects/src/governance.
        Additionally, per ADR-006, inbound governance signals are ADVISORY
        ONLY — never auto-apply. Flag any inbound handler that mutates local
        case state, local reputation, or local sanctions on receipt of a
        federated activity.

    - path: "crates/apub/apub/src/governance/**"
      instructions: |
        Phase 6 inbox/outbox wiring. Same ADR-006 and ADR-014 rules.

    - path: "tests/e2e.rs"
      instructions: |
        Integration tests must hit a real Postgres. Never mock the DB. Flag
        mock_db, MockDb, InMemoryPgPool, or equivalent. Phase 1's
        governance_log_hash_chain_holds is the reference pattern.

    - path: "docs/brehon-law-inspired-network/99-decisions-and-open-questions.md"
      instructions: |
        ADRs are append-only. Supersedes are fine (a new ADR referencing the
        old one), but do NOT edit the body of an existing ADR. Flag any
        in-place modification of ADR-001 through ADR-015.

  tools:
    markdownlint:
      enabled: true
    languagetool:
      enabled: false
    shellcheck:
      enabled: true
    ruff:
      enabled: false
    hadolint:
      enabled: true
    gitleaks:
      enabled: true

chat:
  auto_reply: true
