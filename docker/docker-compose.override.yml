# Pilot-internal override — Brehon home-network testing (2026-06-13).
# Layers bridge wiring onto the vendored docker-compose.yml lemmy service.
# docker compose auto-loads this file; the base compose stays upstream-clean.
#
# Wires Lemmy -> Brehon bridge B-publish sanction delivery + room provisioning:
#  - BRIDGE_SANCTION_CALLBACK_URL: Lemmy seeds 1 sanction_subscriber row from
#    this at startup (crates/server/src/lib.rs) AND POSTs sanction events here.
#  - BRIDGE_ROOM_EVENT_URL: the governance_case_after_transition hook
#    (bridge_notify.rs) POSTs CaseTransition events here on case-status changes;
#    the bridge provisions jury/appeal/emergency Matrix rooms. Overrides the
#    historical localhost:9009/brehon/notify placeholder const.
#  - BRIDGE_CALLBACK_SECRET: MUST match the bridge's value (Bearer auth on BOTH
#    /brehon/sanction-event AND /brehon/room-event). Bridge side is in
#    services/bridge/docker-compose.pilot.yml.
#  - extra_hosts: makes host.docker.internal resolve to the host gateway so
#    the URL is stable across network recreation (the bridge is in a separate
#    compose project, published on host port 8082).
services:
  lemmy:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BRIDGE_SANCTION_CALLBACK_URL=http://host.docker.internal:8082/brehon/sanction-event
      - BRIDGE_ROOM_EVENT_URL=http://host.docker.internal:8082/brehon/room-event
      - BRIDGE_CALLBACK_SECRET=brehon-bridge-callback-secret-pilot-01
