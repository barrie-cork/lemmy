# Docker Compose for Brehon bridge development stack.
#
# Usage (integration tests):
#   cd services/bridge
#   docker compose up -d
#   cargo test --test dm_round_trip -- --ignored
#   docker compose down
#
# Federation-disabled posture; ip_source NOT set (issue-#465 loopback fix).
# Dev-only tokens matching registration.yaml.
#
# M1 scope: only Tuwunel is included here. The bridge binary is started
# separately (e.g. `cargo run` on the host) during integration test setup.
# A bridge service entry will be added in Task 15 once the Dockerfile exists.

version: "3.9"

services:
  tuwunel:
    image: ghcr.io/matrix-construct/tuwunel@sha256:1319f9fd40a92a46251e86bd7865facf24d1c974b30731f1bd3059eb446e318f
    environment:
      TUWUNEL_SERVER_NAME: "localhost"
      TUWUNEL_DATABASE_PATH: "/var/lib/tuwunel"
      TUWUNEL_PORT: "8448"                              # R-PORT: keep bridge http://tuwunel:8448 valid
      TUWUNEL_ADDRESS: "0.0.0.0"
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_REGISTRATION_TOKEN: "brehon-e2e-reg-token"   # R-REGTOKEN (dev-only — NOT for production)
      TUWUNEL_MAX_REQUEST_SIZE: "20971520"
      TUWUNEL_APPSERVICE_DIR: "/etc/tuwunel/appservices"   # auto-loads registration.yaml at startup
    volumes:
      - tuwunel_data:/var/lib/tuwunel
      - ./registration.yaml:/etc/tuwunel/appservices/registration.yaml:ro
    ports:
      - "8448:8448"
    networks:
      - bridge-net

  # M3 RTC stack (profile-gated). `docker compose up` with no profile starts
  # NONE of these — a governance-only instance never boots the RTC sidecars.
  # Enable with `--profile rtc`. Image tags are pinned; exact tags confirmed
  # against the pulled images by the deploy-smoke gate.
  livekit:
    image: livekit/livekit-server:v1.7   # Apache-2.0; pinned to v1.7 (HTTP/1.1 Twirp compat with livekit-api 0.4.x)
    profiles: ["rtc"]
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "devkey: devsecret"]   # explicit --keys "key: secret" so LiveKit verifies the devsecret-signed JWTs the bridge + tests mint (v1.7 --dev does NOT set keys; its placeholder secret is "secret", not "devsecret"). --bind 0.0.0.0 for host port-map reachability.
    ports: ["7880:7880", "7881:7881"]
    networks: [bridge-net]
  lk-jwt-service:
    image: ghcr.io/element-hq/lk-jwt-service:0.3.0   # Apache-2.0; pin at impl
    profiles: ["rtc"]
    environment:
      LIVEKIT_URL: "ws://livekit:7880"
      LIVEKIT_KEY: "devkey"        # dev-only; real key via .env at deploy
      LIVEKIT_SECRET: "devsecret"
    ports: ["8085:8080"]           # host 8085 — avoids the bridge's 8080
    networks: [bridge-net]
  element-call:
    image: ghcr.io/element-hq/element-call:v0.6.0    # AGPL-3.0; pinned (v-prefix) — verified via docker manifest inspect 2026-06-18
    profiles: ["rtc"]
    ports: ["8086:8080"]
    networks: [bridge-net]

  # Bridge service: Task 15 adds the Dockerfile. Uncomment once available.
  # bridge:
  #   build: .
  #   environment:
  #     TUWUNEL_URL: "http://tuwunel:8448"
  #     AS_TOKEN: "brehon-as-dev-token-01"      # dev-only — NOT for production
  #     HS_TOKEN: "brehon-hs-dev-token-01"      # dev-only — NOT for production
  #     BRIDGE_PORT: "8080"
  #     BREHON_READ_URL: "http://host.docker.internal:3000/api/v4/governance/messaging-config"
  #     BREHON_NOTIFY_URL: "http://host.docker.internal:3000/bridge/notify"
  #   ports:
  #     - "8080:8080"
  #   networks:
  #     - bridge-net
  #   depends_on:
  #     - tuwunel

networks:
  bridge-net:
    driver: bridge

volumes:
  tuwunel_data:
