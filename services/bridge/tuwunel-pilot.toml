# Tuwunel pilot config — Brehon home-network testing.
# server_name = matrix.agentgrey.app (exposed via Cloudflare Tunnel 2026-06-13).
# Registration is TOKEN-GATED (not open): allow_registration=true + a registration_token
# means only people holding the shared token can register. Safe to expose publicly.
# Federation OFF (closed household pilot). AS registration wired at bridge-setup time.
[global]
server_name = "matrix.agentgrey.app"
database_path = "/var/lib/tuwunel"
port = 8008
address = "0.0.0.0"
allow_registration = true
registration_token = "f06a581aa717a4e41bdb6f04e592c726"
allow_federation = false
max_request_size = 20971520

# Application-service registration directory. Every readable YAML file here is
# loaded at startup (Tuwunel v1.7.1 docs/appservices.md "Registration file
# directory" method). The Brehon bridge's registration.yaml is mounted into it
# by docker-compose.pilot.yml. Changes need a Tuwunel restart to reload.
appservice_dir = "/etc/tuwunel/appservices"
