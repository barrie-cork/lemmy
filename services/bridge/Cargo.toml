[workspace]
# Standalone workspace — not part of the Lemmy monorepo workspace (excluded
# via `exclude = ["services/bridge"]` in the root Cargo.toml).

[package]
name = "brehon-bridge"
version = "0.1.0"
edition = "2021"
publish = false

# Ref MCP unavailable at authoring time (no credits). Versions follow plan
# §13 Task 8 pins and DQ a192dbab1de8-002 resolution. axum "0.8" from
# training knowledge; laptop validate-pending step confirms compatibility.
[dependencies]
matrix-sdk = "0.18"
ruma-appservice-api = "0.16"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Subscriber + EnvFilter so the tracing::{info,warn,error}! calls throughout
# the bridge actually emit (without an installed subscriber they are no-ops).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
# ruma-common 0.19.0's StringEnum derive conflicts with time 0.3.48+ (E0119).
# Pin to last known-good version until ruma-common releases a fix.
time = "=0.3.47"
# ed25519 signing/verification for link-claim handler (task 12).
# ed25519-dalek 2.2.0 is already in the lock as a transitive dep; pin to 2.x.
ed25519-dalek = "2"
hex = "0.4"
jsonwebtoken = "9"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# sha2 + rust-s3: used only by tests/recording.rs since the recording-capture
# scaffold was cut (2026-07-02); move back to [dependencies] when the live
# Egress/upload chain is wired.
sha2 = "0.10"
rust-s3 = "0.34"
# livekit-api: publisher-client handle for the emergency-mute <500ms measurement (task 4 marquee,
# criterion 141). Provides AccessToken (publisher-client grant state) + RoomClient (admin API to
# revoke publish and verify zero-holder invariant at the CLIENT perspective, not the server handler
# return value). Dev-dep only — not in the production bridge binary. R14: Cargo.lock regenerated
# in the same commit as emergency_mute.rs (DQ 3004b6625b83-001 option-B, gate-1 ratify).
livekit-api = "0.4"
# Pin: livekit-api 0.4.24 declares livekit-protocol ^0.7.7 but the resolver
# over-selects 0.7.8, whose new required struct fields (page_token /
# revoke_token_ts / auth_realm) livekit-api 0.4.24's source does not
# initialize → E0063 inside livekit-api. Pin to 0.7.7 (the version
# livekit-api 0.4.24 was built against). Remove if livekit-api is bumped
# to a release that supports livekit-protocol 0.7.8.
livekit-protocol = "=0.7.7"
