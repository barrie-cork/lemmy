# Matrix Application Service registration for the Brehon bridge.
# Loaded by Tuwunel at startup to authorize the bridge AS.
#
# Dev-only token pair — NOT for production.
# Replace as_token and hs_token with randomly generated secrets before
# deploying to any environment beyond the local docker-compose stack.
id: brehon-bridge
url: http://bridge:8080
as_token: "brehon-as-dev-token-01"  # dev-only — NOT for production
hs_token: "brehon-hs-dev-token-01"  # dev-only — NOT for production
sender_localpart: brehon
namespaces:
  users:
    - exclusive: true
      regex: "@_brehon_.*"
  aliases:
    # The room provisioner creates aliases of the form `<type>-case-<id>`
    # (jury-case-N, appeal-case-N, emergency-case-N, community-case-N,
    # spinout-case-N, membership-case-N — see room_provisioner.rs). The AS may
    # only create aliases inside its registered namespace, else Tuwunel rejects
    # createRoom with M_EXCLUSIVE. This regex must cover every alias format the
    # provisioner emits. (The old `#brehon_.*` matched none of them.)
    - exclusive: false
      regex: "#.*-case-.*"
  rooms: []
