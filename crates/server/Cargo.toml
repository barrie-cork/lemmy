[package]
name = "lemmy_server"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
default-run = "lemmy_server"

[lib]
test = false
doctest = false

[lints]
workspace = true

[features]
default = []

[dependencies]
lemmy_api = { workspace = true }
lemmy_api_routes = { workspace = true }
lemmy_api_routes_v3 = { workspace = true }
lemmy_apub = { workspace = true }
lemmy_apub_activities = { workspace = true }
lemmy_apub_objects = { workspace = true }
lemmy_utils = { workspace = true }
lemmy_db_schema = { workspace = true }
lemmy_diesel_utils = { workspace = true }
lemmy_api_utils = { workspace = true }
lemmy_routes = { workspace = true }
lemmy_apub_send = { workspace = true }
lemmy_db_views_site = { workspace = true }
activitypub_federation = { workspace = true }
actix-web = { workspace = true }
tracing = { workspace = true }
tracing-actix-web = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest-middleware = { workspace = true }
reqwest-tracing = { workspace = true }
serde_json = { workspace = true }
tokio.workspace = true
clap = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
mimalloc = "0.1.48"

[dev-dependencies]
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tokio = { workspace = true }
lemmy_api = { workspace = true, features = ["full"] }
lemmy_api_crud = { workspace = true, features = ["full"] }
lemmy_api_common = { workspace = true, features = ["full"] }
lemmy_api_routes = { workspace = true }
lemmy_api_utils = { workspace = true, features = ["full"] }
lemmy_db_schema = { workspace = true, features = ["full"] }
lemmy_db_schema_file = { workspace = true, features = ["full"] }
lemmy_db_views_governance_case = { workspace = true, features = ["full"] }
lemmy_db_views_governance_modlog = { workspace = true, features = ["full"] }
lemmy_db_views_jury_queue = { workspace = true, features = ["full"] }
lemmy_db_views_local_user = { workspace = true, features = ["full"] }
lemmy_diesel_utils = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
reqwest = { workspace = true }
reqwest-middleware = { workspace = true }
actix-web = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
diesel_migrations = { workspace = true }
sha2 = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
