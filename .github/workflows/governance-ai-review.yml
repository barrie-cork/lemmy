name: governance-ai-review

on:
  pull_request:
    branches:
      - governance-v0
    paths:
      - 'crates/db_schema/src/source/governance/**'
      - 'crates/db_views/governance_case/**'
      - 'crates/db_views/jury_queue/**'
      - 'crates/db_views/governance_modlog/**'
      - 'crates/db_views/reputation/**'
      - 'crates/api/api_common/src/governance.rs'
      - 'crates/api/api/src/governance/**'
      - 'crates/api/api_crud/src/governance/**'
      - 'crates/apub/objects/src/governance/**'
      - 'crates/apub/activities/src/governance/**'
      - 'crates/apub/apub/src/governance/**'
      - 'crates/server/src/governance.rs'
      - 'migrations/**'

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: gov-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect phase from changed paths
        id: phase
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=50
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          git diff --name-only "$BASE"...HEAD > /tmp/changed.txt
          cat /tmp/changed.txt

          phase="unknown"
          # Detection order matters — first match wins. Phase 4 (api handlers)
          # beats Phase 3 (api_common DTOs) beats Phase 2 (db_views) beats
          # Phase 1 (schema/migrations). Phase 6 (apub) is independent.
          if grep -qE '^crates/apub/(objects|activities|apub)/src/governance/' /tmp/changed.txt; then
            phase="6"
          elif grep -qE '^crates/api/(api|api_crud)/src/governance/|^crates/server/src/governance\.rs' /tmp/changed.txt; then
            phase="4"
          elif grep -qE '^crates/api/api_common/src/governance\.rs' /tmp/changed.txt; then
            phase="3"
          elif grep -qE '^crates/db_views/(governance_case|jury_queue|governance_modlog|reputation)/' /tmp/changed.txt; then
            phase="2"
          elif grep -qE '^crates/db_schema/src/source/governance/|^migrations/' /tmp/changed.txt; then
            phase="1"
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Detected phase: $phase"

      - name: Assemble diff and gate on size
        id: diff
        run: |
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          git diff --unified=3 "$BASE"...HEAD > /tmp/full.diff
          full_bytes=$(wc -c < /tmp/full.diff)
          # actions/ai-inference@v2 has a hard 8000-token input cap on the
          # GitHub Models endpoint (free / Pro / Education / Business — only
          # paid-usage tier raises it). 28000 bytes is ~7K tokens, leaving
          # ~1K headroom for the rubric + prompt scaffolding.
          # Phase-size PRs always exceed this cap; truncating to the first
          # 28KB would give a noisy partial review of just the
          # alphabetically-earliest files. Better to skip cleanly and let
          # CodeRabbit Pro + the ADR-compliance scanner cover phase PRs,
          # while AI review still runs on small (single-task) PRs where
          # it adds signal.
          # See feedback_ai_review_413_oversize.md.
          if [ "$full_bytes" -gt 28000 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "full_bytes=$full_bytes" >> "$GITHUB_OUTPUT"
            echo "Diff size $full_bytes bytes exceeds 28KB AI-review cap — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "full_bytes=$full_bytes" >> "$GITHUB_OUTPUT"
            cp /tmp/full.diff /tmp/pr.diff
            wc -c /tmp/pr.diff
          fi

      - name: Load ADR rubric and phase rubric
        id: rubric
        if: steps.diff.outputs.skip == 'false'
        run: |
          cat .github/ai-review-prompts/adr-rubric.md > /tmp/rubric.md
          phase="${{ steps.phase.outputs.phase }}"
          if [ -f ".github/ai-review-prompts/phase-${phase}-rubric.md" ]; then
            printf '\n\n---\n\n' >> /tmp/rubric.md
            cat ".github/ai-review-prompts/phase-${phase}-rubric.md" >> /tmp/rubric.md
          else
            printf '\n\n_No phase-specific rubric for phase %s; applying ADR rubric only._\n' "$phase" >> /tmp/rubric.md
          fi
          wc -c /tmp/rubric.md

      - name: Assemble prompt
        id: prompt
        if: steps.diff.outputs.skip == 'false'
        run: |
          {
            echo "You are an ADR-compliance reviewer for a Rust governance fork of Lemmy."
            echo "Produce a short, actionable review comment, under 400 words, valid Markdown."
            echo ""
            echo "## Rules"
            echo "- Cite ADR IDs exactly (ADR-001 through ADR-015 only) when flagging."
            echo "- Cite file:line when quoting code."
            echo "- Silence is fine: if nothing is wrong, say \"No ADR violations detected in this diff.\" and stop."
            echo "- Do NOT critique upstream Lemmy conventions outside governance namespaces."
            echo "- Do NOT duplicate Woodpecker CI checks (cargo build, clippy, rustfmt, tests)."
            echo ""
            echo "## Detected phase"
            echo "Phase ${{ steps.phase.outputs.phase }}"
            echo ""
            echo "## ADR rubric + phase rubric"
            cat /tmp/rubric.md
            echo ""
            echo "## Diff (truncated to 28KB)"
            echo '```diff'
            cat /tmp/pr.diff
            echo '```'
          } > /tmp/prompt.txt
          wc -c /tmp/prompt.txt

      - name: Run AI inference
        id: infer
        if: steps.diff.outputs.skip == 'false'
        uses: actions/ai-inference@v2
        with:
          model: openai/gpt-4o-mini
          prompt-file: /tmp/prompt.txt
          max-tokens: 4000
          system-prompt: |
            You are a precise, laconic code reviewer. Output valid Markdown.
            Never hallucinate ADR IDs. Only reference ADR-001 through ADR-015
            as listed in the rubric. If the diff is empty or unreviewable,
            say so plainly and stop.

      - name: Post AI review as PR comment
        if: steps.diff.outputs.skip == 'false'
        uses: actions/github-script@v7
        env:
          # Passing the model output through env avoids GitHub Actions
          # expression interpolation injecting backticks or dollar signs
          # into the JavaScript template literal below.
          AI_REVIEW: ${{ steps.infer.outputs.response }}
          PHASE: ${{ steps.phase.outputs.phase }}
        with:
          script: |
            const review = process.env.AI_REVIEW || '_AI inference returned empty output. Check the workflow run for details._';
            const phase = process.env.PHASE || 'unknown';
            const runId = context.runId;
            const body = [
              `## AI governance review — phase ${phase}`,
              '',
              review,
              '',
              '<details><summary>About this review</summary>',
              '',
              'Generated by [`actions/ai-inference@v2`](https://github.com/actions/ai-inference) using `openai/gpt-4o-mini` on the GitHub Models tier (8K input cap; phase-size PRs are skipped). Advisory only — a maintainer must act on or dismiss each finding before merge.',
              '',
              `Re-run: \`gh run rerun ${runId} --failed\``,
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });

      - name: Post skip notice for phase-size PR
        if: steps.diff.outputs.skip == 'true'
        uses: actions/github-script@v7
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          DIFF_BYTES: ${{ steps.diff.outputs.full_bytes }}
        with:
          script: |
            const phase = process.env.PHASE || 'unknown';
            const bytes = process.env.DIFF_BYTES;
            const body = [
              `## AI governance review — phase ${phase} — skipped`,
              '',
              `Diff is ${bytes} bytes, which exceeds the 28KB cap that fits within the \`actions/ai-inference@v2\` 8000-token input limit. Phase-size PRs are skipped cleanly rather than reviewed against a truncated first-28KB slice that would miss most of the diff.`,
              '',
              'Coverage on this PR comes from CodeRabbit Pro (assertive review) and the deterministic ADR-compliance scanner. AI review still runs on small (single-task) PRs where the full diff fits.',
              '',
              '_See `feedback_ai_review_413_oversize.md` for the rationale._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
