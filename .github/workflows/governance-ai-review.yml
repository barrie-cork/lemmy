name: governance-ai-review

on:
  pull_request:
    branches:
      - governance-v0
    paths:
      - 'crates/db_schema/src/source/governance/**'
      - 'crates/db_views/governance_case/**'
      - 'crates/db_views/jury_queue/**'
      - 'crates/db_views/governance_modlog/**'
      - 'crates/db_views/reputation/**'
      - 'crates/api/api_common/src/governance.rs'
      - 'crates/api/api/src/governance/**'
      - 'crates/api/api_crud/src/governance/**'
      - 'crates/apub/objects/src/governance/**'
      - 'crates/apub/activities/src/governance/**'
      - 'crates/apub/apub/src/governance/**'
      - 'crates/server/src/governance.rs'
      - 'migrations/**'

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write  # Required by anthropics/claude-code-action@v1 for OIDC auth.

concurrency:
  group: gov-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Detect phase from changed paths
        id: phase
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=50
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          git diff --name-only "$BASE"...HEAD > /tmp/changed.txt
          cat /tmp/changed.txt

          phase="unknown"
          # Detection order matters — first match wins. Phase 4 (api handlers)
          # beats Phase 3 (api_common DTOs) beats Phase 2 (db_views) beats
          # Phase 1 (schema/migrations). Phase 6 (apub) is independent.
          if grep -qE '^crates/apub/(objects|activities|apub)/src/governance/' /tmp/changed.txt; then
            phase="6"
          elif grep -qE '^crates/api/(api|api_crud)/src/governance/|^crates/server/src/governance\.rs' /tmp/changed.txt; then
            phase="4"
          elif grep -qE '^crates/api/api_common/src/governance\.rs' /tmp/changed.txt; then
            phase="3"
          elif grep -qE '^crates/db_views/(governance_case|jury_queue|governance_modlog|reputation)/' /tmp/changed.txt; then
            phase="2"
          elif grep -qE '^crates/db_schema/src/source/governance/|^migrations/' /tmp/changed.txt; then
            phase="1"
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "Detected phase: $phase"

      - name: Assemble diff and gate on size
        id: diff
        run: |
          BASE=$(git merge-base "origin/${{ github.event.pull_request.base.ref }}" HEAD)
          git diff --unified=3 "$BASE"...HEAD > /tmp/full.diff
          full_bytes=$(wc -c < /tmp/full.diff)
          # The 28KB cap is preserved from the GitHub Models era to keep
          # the "AI review for small PRs only" semantic: phase-size PRs
          # are skipped cleanly so AI review adds signal on focused diffs
          # rather than producing noisy partial reads of phase commits.
          # Claude itself can take much larger inputs (200K context), so
          # the cap is a deliberate scope choice, not a technical limit.
          # On-demand review for phase-size PRs is available via
          # `@claude review this phase` comment routed through
          # claude-code-action.yml (separate workflow, comment-triggered).
          # See feedback_ai_review_413_oversize.md.
          if [ "$full_bytes" -gt 28000 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "full_bytes=$full_bytes" >> "$GITHUB_OUTPUT"
            echo "Diff size $full_bytes bytes exceeds 28KB AI-review cap — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "full_bytes=$full_bytes" >> "$GITHUB_OUTPUT"
            cp /tmp/full.diff /tmp/pr.diff
            wc -c /tmp/pr.diff
          fi

      - name: Load rubric + diff into step outputs
        id: payload
        if: steps.diff.outputs.skip == 'false'
        run: |
          # Assemble rubric: ADR rubric + phase-specific rubric (if any).
          cat .github/ai-review-prompts/adr-rubric.md > /tmp/rubric.md
          phase="${{ steps.phase.outputs.phase }}"
          if [ -f ".github/ai-review-prompts/phase-${phase}-rubric.md" ]; then
            printf '\n\n---\n\n' >> /tmp/rubric.md
            cat ".github/ai-review-prompts/phase-${phase}-rubric.md" >> /tmp/rubric.md
          else
            printf '\n\n_No phase-specific rubric for phase %s; applying ADR rubric only._\n' "$phase" >> /tmp/rubric.md
          fi
          wc -c /tmp/rubric.md

          # Push rubric + diff into step outputs as multiline values so the
          # claude-code-action prompt can interpolate them via ${{ steps.X.outputs.Y }}.
          # Bash $(...) substitution is NOT expanded inside an action's `prompt:` input;
          # GHA step outputs interpolated via ${{ }} ARE expanded. See
          # https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#multiline-strings
          {
            echo "rubric<<RUBRIC_EOF"
            cat /tmp/rubric.md
            echo "RUBRIC_EOF"
            echo "diff<<DIFF_EOF"
            cat /tmp/pr.diff
            echo "DIFF_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Claude Code Action governance review
        if: steps.diff.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the Brehon governance ADR reviewer for phase ${{ steps.phase.outputs.phase }}.
            Produce a short, actionable review comment under 400 words, valid Markdown.

            ## Rules
            - Cite ADR IDs exactly (ADR-001 through ADR-015 only) when flagging.
            - Cite file:line when quoting code.
            - Silence is fine: if nothing is wrong, say "No ADR violations detected in this diff." and stop.
            - Do NOT critique upstream Lemmy conventions outside governance namespaces.
            - Do NOT duplicate Woodpecker / cargo-test-e2e CI checks (cargo build, clippy, rustfmt, tests).
            - Never hallucinate ADR IDs. Only reference ADR-001 through ADR-015 as listed in the rubric.

            ## ADR rubric + phase rubric
            ${{ steps.payload.outputs.rubric }}

            ## Diff (truncated to 28KB; phase-size PRs are skipped earlier)
            ```diff
            ${{ steps.payload.outputs.diff }}
            ```

      - name: Post skip notice for phase-size PR
        if: steps.diff.outputs.skip == 'true'
        uses: actions/github-script@v7
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
          DIFF_BYTES: ${{ steps.diff.outputs.full_bytes }}
        with:
          script: |
            const phase = process.env.PHASE || 'unknown';
            const bytes = process.env.DIFF_BYTES;
            const body = [
              `## AI governance review — phase ${phase} — skipped`,
              '',
              `Diff is ${bytes} bytes, which exceeds the 28KB scope cap for automatic governance review. Phase-size PRs are skipped here so the auto-review stays focused on small (single-task) PRs where it adds signal.`,
              '',
              'Coverage on this PR comes from CodeRabbit (auto-review) and the deterministic ADR-compliance scanner. For on-demand AI review of phase-size PRs, post a comment containing `@claude review this phase` to invoke `.github/workflows/claude-code-action.yml` (no input cap; full diff reviewed).',
              '',
              '_See `feedback_ai_review_413_oversize.md` for the rationale._'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
