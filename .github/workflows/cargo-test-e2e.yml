name: cargo-test-e2e

# Runs the governance e2e test suite on push to phase-v1-* branches.
# Each test spins up its own Postgres via testcontainers (see
# crates/server/tests/e2e.rs:83), so the runner only needs Docker — no
# services: block required.
#
# Trigger pattern is push-only on phase-v1-* per option (b) decided
# 2026-04-28: e2e fires when the daemon's finalize-merge moves the
# phase-branch tip, NOT on every junior/* worktree push (workspace
# check + clippy still runs on junior/* via cargo-validate-workspace.yml).
# This saves ~80% of e2e runs across a sub-phase; trade-off is e2e
# regressions surface AFTER impl finalize-merges, requiring fix-in-PR.
#
# This workflow complements the upstream Woodpecker CI (.woodpecker.yml)
# which runs Lemmy's native cargo checks. Here we surface e2e pass/fail
# on phase-branch tips so the BM (and ci-watcher) can gate merges.

on:
  push:
    branches:
      - 'phase-v1-*'
    paths:
      - 'crates/**'
      - 'migrations/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/cargo-test-e2e.yml'

permissions:
  contents: read

concurrency:
  # Use github.ref so concurrent pushes to the same branch cancel-in-progress;
  # different branches run independently. Matches cargo-validate-workspace.yml.
  group: cargo-test-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: governance e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # crates/email/translations/ is a submodule pointing to
          # LemmyNet/lemmy-translations; lemmy_email/build.rs reads it
          # at compile time, so we must initialise it.
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned in rust-toolchain.toml; the action reads that file.
          toolchain: stable

      - name: Install libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev pkg-config

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-e2e-${{ runner.os }}-

      - name: Compile e2e test target
        run: cargo test --test e2e -p lemmy_server --no-run

      - name: Run e2e (single-threaded; testcontainers per test)
        env:
          RUST_BACKTRACE: 1
        run: cargo test --test e2e -p lemmy_server -- --test-threads=1
