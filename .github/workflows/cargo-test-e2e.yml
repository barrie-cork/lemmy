name: cargo-test-e2e

# Runs the governance e2e test suite on a chosen ref. Each test spins
# up its own Postgres via testcontainers (see
# crates/server/tests/e2e.rs:83), so the runner only needs Docker — no
# services: block required.
#
# Trigger pattern is `workflow_dispatch`-only per 2026-04-28 minutes-
# budget audit. Auto-on-push to phase-v1-* burned ~26 min/run = ~129
# min/month — too expensive for the GitHub Free / Student-Pro 3,000
# min quota. Local laptop e2e is the primary path:
#
#   cargo test -p lemmy_server --test e2e --features full -- --test-threads=1
#
# (~26 min on PC; same wall-clock as GH Actions, zero billed.)
#
# Use the GH-Actions path (workflow_dispatch) only when:
#   (a) advisor wants an audit-trail log surface for a contested run,
#   (b) PC is unavailable, or
#   (c) cross-environment reproducibility is the question.
#
# To dispatch:
#   gh workflow run cargo-test-e2e.yml --repo barrie-cork/lemmy --ref phase-v1-<phase>
#
# This workflow complements the upstream Woodpecker CI (.woodpecker.yml)
# which runs Lemmy's native cargo checks.

on:
  workflow_dispatch:
    inputs:
      ref_to_test:
        description: 'Branch or SHA to checkout (defaults to caller-supplied ref)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Use github.ref so concurrent pushes to the same branch cancel-in-progress;
  # different branches run independently. Matches cargo-validate-workspace.yml.
  group: cargo-test-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: governance e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # crates/email/translations/ is a submodule pointing to
          # LemmyNet/lemmy-translations; lemmy_email/build.rs reads it
          # at compile time, so we must initialise it.
          submodules: recursive

      - name: Install Rust toolchain
        # Pinned in rust-toolchain.toml (1.95). With no `toolchain:` input,
        # dtolnay/rust-toolchain@master reads rust-toolchain.toml. Specifying
        # `toolchain: stable` would silently override the pin (closes #37).
        uses: dtolnay/rust-toolchain@master

      - name: Install libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev pkg-config

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-e2e-${{ runner.os }}-

      - name: Compile e2e test target
        run: cargo test --test e2e -p lemmy_server --no-run

      - name: Run e2e (single-threaded; testcontainers per test)
        env:
          RUST_BACKTRACE: 1
        run: cargo test --test e2e -p lemmy_server -- --test-threads=1
